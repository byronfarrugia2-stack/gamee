<!DOCTYPE html>

<meta charset="utf-8">
<title>Blackout Express</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script>

let puzzle1Solved = false;
let puzzle2Solved = false;
let puzzle3Solved = false;
let puzzle4Solved = false;
let puzzle5Solved = false;
let puzzle6Solved = false;

let buttonSequence = [];
const correctSequence = [
  "red",
  "blue",
  "yellow",
  "green"
];

function updateObjective(text){
  document.querySelector("#objective")
    .setAttribute("value", text);
}

function solvePassengerPuzzle(){

  if(puzzle1Solved) return;

  puzzle1Solved = true;

  document
  .querySelector("#door1")
  .setAttribute(
    "animation",
    "property: position; to: 0 3 -30; dur: 2000"
  );

  updateObjective(
    "Go to the Dining Car"
  );

}

function solveDiningPuzzle(){

  if(puzzle2Solved) return;

  puzzle2Solved = true;

  document
  .querySelector("#door2")
  .setAttribute(
    "animation",
    "property: position; to: 0 3 -60; dur: 2000"
  );

  updateObjective(
    "Go to the Mirror Car"
  );

}

function pressMirrorButton(color){

  buttonSequence.push(color);

  if(buttonSequence.length < 4){
    return;
  }

  let correct = true;

  for(let i = 0; i < 4; i++){

    if(buttonSequence[i] !== correctSequence[i]){

      correct = false;

    }

  }

  if(correct){

    puzzle3Solved = true;

    document
    .querySelector("#door3")
    .setAttribute(
      "animation",
      "property: position; to: 0 3 -90; dur: 2000"
    );

    updateObjective(
      "Move into the Sleeping Cabins"
    );

  }

  buttonSequence = [];

}

AFRAME.registerComponent("train-sway",{

  tick:function(time){

    let sway =
      Math.sin(time/1200)*0.01;

    this.el.object3D.rotation.z =
      sway;

  }

});

AFRAME.registerComponent("flicker",{

  tick:function(time){

    let value =
      1.2 + Math.sin(time/100)*0.2;

    this.el.setAttribute(
      "intensity",
      value
    );

  }

});

</script>
