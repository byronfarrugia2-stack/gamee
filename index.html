<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Blackout Express</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script>

window.addEventListener("load",()=>{

let portraitsSolved = 0;
let sequenceInput = [];
const correctSequence = ["red","blue","green","yellow"];

document.querySelectorAll(".portrait").forEach(p=>{

p.addEventListener("click",()=>{

if(p.dataset.done==="true") return;

p.dataset.done="true";

p.setAttribute("color","#00ff88");

portraitsSolved++;

if(portraitsSolved===3){

document.querySelector("#objective")
.setAttribute("value",
"Objective: Find the hidden mirror puzzle");

document.querySelector("#floorHatch")
.setAttribute(
"animation",
"property:rotation;to:-90 0 0;dur:2000");

}

});

});

document.querySelectorAll(".puzzleButton").forEach(btn=>{

btn.addEventListener("click",()=>{

let colour = btn.dataset.colour;

sequenceInput.push(colour);

if(sequenceInput.length===4){

let success=true;

for(let i=0;i<4;i++){

if(sequenceInput[i]!==correctSequence[i]){

success=false;

}

}

if(success){

document.querySelector("#objective")
.setAttribute("value",
"Objective: Proceed through the secret door");

document.querySelector("#secretDoor")
.setAttribute(
"animation",
"property:position;to:0 8 -35;dur:3000");

document.querySelector("#alarm")
.setAttribute("value",
"THE TRAIN REMEMBERS YOU");

}else{

document.querySelector("#alarm")
.setAttribute("value",
"WRONG SEQUENCE");

}

sequenceInput=[];

}

});

});

});

AFRAME.registerComponent('train-sway',{

tick:function(time){

let sway = Math.sin(time/1000)*0.01;

this.el.object3D.rotation.z=sway;

}

});

AFRAME.registerComponent('flicker',{

tick:function(time){

let light=this.el;

light.setAttribute(
"intensity",
1.3+Math.sin(time/120)*0.3
);

}

});

</script>

</head>

<body>

<a-scene background="color:#050505">

<a-sky color="#000814"></a-sky>

<a-entity train-sway>

<!-- TRAIN BODY -->

<a-box
position="0 1.8 -18"

height="4"
depth="40"
color="#2d1a0f">
</a-box>

<!-- FLOOR -->

width="7.5"
height="0.2"
depth="39"

</a-box>

<!-- LIGHTS -->

<a-light
flicker
type="point"
position="0 3 -5"
color="#ffe8a3"
intensity="1.5">
</a-light>

<a-light
flicker
type="point"
position="0 3 -15"
color="#ffe8a3">
</a-light>

<a-light
flicker
type="point"
position="0 3 -25"
color="#ffe8a3">
</a-light>

<!-- WINDOWS -->

<a-plane
position="-3.8 2 -10"

<a-plane

height="1.5"

</a-plane>

<a-plane
position="3.8 2 -10"

</a-cylinder>

<a-cylinder
position="0 0.5 -15"

<!-- PORTRAITS -->

<a-box

<!-- HATCH -->

</a-box>

<!-- MIRROR ROOM -->

</a-entity>

</a-scene>

</html>
